<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Producto - HTML puro</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .producto {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 340px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .carrito {
      text-align: right;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .producto img {
      width: 100%;
      border-radius: 6px;
    }

    .categoria {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      margin: 12px 0 4px;
    }

    .producto h2 {
      margin: 0 0 8px;
    }

    .precio {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2b4bee;
      margin: 8px 0;
    }

    .descripcion {
      font-size: 0.9rem;
      color: #555;
    }

    .cantidad {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }

    .cantidad button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-carrito,
    .btn-comprar {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-carrito {
      background: #fff;
      color: #2b4bee;
      border: 1px solid #2b4bee;
    }

    .btn-comprar {
      background: #2b4bee;
      color: #fff;
      border: none;
    }

    .resultado {
      margin-top: 16px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f8f8f8;
    }

    .resultado p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="producto">
    <div class="carrito">🛒 Carrito: <span id="contador-carrito">0</span></div>

    <img src="https://picsum.photos/seed/zapatillas/340/220" alt="Zapatillas Runner">

    <p class="categoria">Calzado</p>
    <h2>Zapatillas Runner</h2>
    <p class="precio">$ 45000</p>
    <p class="descripcion">
      Zapatillas livianas para correr, con suela de goma antideslizante y plantilla acolchada.
    </p>

    <div class="cantidad">
      <button id="restar">-</button>
      <span id="cantidad">1</span>
      <button id="sumar">+</button>
    </div>

    <div class="acciones">
      <button class="btn-carrito" id="agregar-carrito">Agregar al carrito</button>
      <button class="btn-comprar" id="comprar">Comprar</button>
    </div>

    <div id="resultado"></div>
  </div>

  <script>
    const precio = 45000
    let cantidad = 1
    let enCarrito = 0

    const cantidadSpan = document.getElementById('cantidad')
    const contadorCarrito = document.getElementById('contador-carrito')
    const resultado = document.getElementById('resultado')

    document.getElementById('restar').addEventListener('click', () => {
      if (cantidad > 1) {
        cantidad--
        cantidadSpan.textContent = cantidad
      }
    })

    document.getElementById('sumar').addEventListener('click', () => {
      cantidad++
      cantidadSpan.textContent = cantidad
    })

    document.getElementById('agregar-carrito').addEventListener('click', () => {
      enCarrito += cantidad
      contadorCarrito.textContent = enCarrito
    })

    document.getElementById('comprar').addEventListener('click', () => {
      resultado.innerHTML = `
        <div class="resultado">
          <p><strong>Producto:</strong> Zapatillas Runner</p>
          <p><strong>Cantidad:</strong> ${cantidad}</p>
          <p><strong>Total:</strong> $ ${precio * cantidad}</p>
        </div>
      `
    })
  </script>

</body>
</html>
